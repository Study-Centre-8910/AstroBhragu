        // True 3D Sphere & Ring Renderer using Three.js (Zero black seams, Right-to-Left rotation)
        function create3DPlanetSphere(containerEl, planet, width, height) {
            const scene = new THREE.Scene();
            const aspect = width / height;
            const camera = new THREE.PerspectiveCamera(38, aspect, 0.1, 100);
            camera.position.z = planet.isSaturn ? 3.55 : 2.95;

            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(width, height);
            renderer.setPixelRatio(window.devicePixelRatio || 1);
            containerEl.appendChild(renderer.domElement);

            // Seamless Texture Canvas (Purely inside the planet disk, zero black margins)
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            // Fill base color first so no black line ever appears
            ctx.fillStyle = planet.baseColor || '#888888';
            ctx.fillRect(0, 0, 512, 256);

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.ClampToEdgeWrapping;

            const img = new Image();
            img.crossOrigin = "anonymous";
            img.onload = () => {
                // Crop strictly inside the lit planet center so zero black background enters texture
                const minSide = Math.min(img.width, img.height);
                const cropSize = minSide * (planet.cropRatio || 0.55);
                const sx = (img.width - cropSize) / 2;
                const sy = (img.height - cropSize) / 2;

                // Draw seamless mirrored wrap
                ctx.drawImage(img, sx, sy, cropSize, cropSize, 0, 0, 256, 256);
                ctx.save();
                ctx.translate(512, 0);
                ctx.scale(-1, 1);
                ctx.drawImage(img, sx, sy, cropSize, cropSize, 0, 0, 256, 256);
                ctx.restore();

                texture.needsUpdate = true;
            };
            img.onerror = () => {
                if (img.src.indexOf(planet.altImg) === -1) {
                    img.src = planet.altImg;
                }
            };
            img.src = planet.img;

            const planetGroup = new THREE.Group();
            scene.add(planetGroup);

            const radius = planet.isSaturn ? 0.88 : 1.0;
            const geometry = new THREE.SphereGeometry(radius, 48, 48);
            const material = planet.isSun
                ? new THREE.MeshBasicMaterial({ map: texture })
                : new THREE.MeshStandardMaterial({
                    map: texture,
                    roughness: 0.72,
                    metalness: 0.05
                });

            const sphere = new THREE.Mesh(geometry, material);
            planetGroup.add(sphere);

            // Add 3D Rotating Rings for Saturn
            let ringMesh = null;
            if (planet.isSaturn) {
                const ringCanvas = document.createElement('canvas');
                ringCanvas.width = 256;
                ringCanvas.height = 32;
                const rCtx = ringCanvas.getContext('2d');
                const grad = rCtx.createLinearGradient(0, 0, 256, 0);
                grad.addColorStop(0.0, 'rgba(180, 155, 110, 0.05)');
                grad.addColorStop(0.15, 'rgba(215, 190, 140, 0.85)');
                grad.addColorStop(0.45, 'rgba(240, 220, 175, 0.95)');
                grad.addColorStop(0.55, 'rgba(120, 100, 70, 0.25)'); // Cassini division gap
                grad.addColorStop(0.65, 'rgba(225, 200, 150, 0.9)');
                grad.addColorStop(0.92, 'rgba(195, 170, 125, 0.65)');
                grad.addColorStop(1.0, 'rgba(180, 155, 110, 0.0)');
                rCtx.fillStyle = grad;
                rCtx.fillRect(0, 0, 256, 32);

                const ringTex = new THREE.CanvasTexture(ringCanvas);
                const ringGeo = new THREE.RingGeometry(1.12, 1.85, 64);
                // Map radial UVs properly
                const pos = ringGeo.attributes.position;
                const uv = ringGeo.attributes.uv;
                for (let i = 0; i < pos.count; i++) {
                    const vx = pos.getX(i);
                    const vy = pos.getY(i);
                    const dist = Math.sqrt(vx * vx + vy * vy);
                    uv.setXY(i, (dist - 1.12) / (1.85 - 1.12), 0.5);
                }

                const ringMat = new THREE.MeshBasicMaterial({
                    map: ringTex,
                    side: THREE.DoubleSide,
                    transparent: true
                });
                ringMesh = new THREE.Mesh(ringGeo, ringMat);
                ringMesh.rotation.x = Math.PI / 2.45;
                planetGroup.add(ringMesh);

                // Saturn's natural axial tilt
                planetGroup.rotation.z = 0.36;
                planetGroup.rotation.x = 0.14;
            } else {
                planetGroup.rotation.z = 0.12;
            }

            if (!planet.isSun) {
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
                scene.add(ambientLight);

                const dirLight = new THREE.DirectionalLight(0xffffff, 1.1);
                dirLight.position.set(3, 2, 4);
                scene.add(dirLight);
            }

            // Smooth Right-to-Left Axis Rotation
            function animate() {
                requestAnimationFrame(animate);
                sphere.rotation.y -= 0.013;
                if (ringMesh) {
                    ringMesh.rotation.z -= 0.008;
                }
                renderer.render(scene, camera);
            }
            animate();
        }

        function loadChatHistory() {
            const msgContainer = document.getElementById('chat-messages');
            msgContainer.innerHTML = '';
            const history = JSON.parse(localStorage.getItem(getChatStorageKey()) || '[]');
            history.forEach(item => {
                renderMessageBubble(item.sender, item.text);
            });
        }

        function saveAndRenderMessage(sender, text) {
            const history = JSON.parse(localStorage.getItem(getChatStorageKey()) || '[]');
            history.push({ sender, text, time: Date.now() });
            localStorage.setItem(getChatStorageKey(), JSON.stringify(history));
            renderMessageBubble(sender, text);
        }

        function renderMessageBubble(sender, text) {
            const msgContainer = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.innerText = text;
            msgContainer.appendChild(div);
            msgContainer.scrollTop = msgContainer.scrollHeight;
        }

        document.getElementById('send-btn').onclick = sendUserMessage;
        document.getElementById('user-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendUserMessage();
        });

        async function sendUserMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            saveAndRenderMessage('user', text);
            input.value = '';

            document.getElementById('chat-spinner').style.display = 'block';

            const telegramMessage = 
                `🔮 *ASTROBHRIGU CONSULTATION*\n\n` +
                `🆔 *User Code:* \`${USER_REPLY_CODE}\`\n` +
                `👤 *Name:* ${currentUser.name}\n` +
                `📅 *DOB:* ${currentUser.dob}\n` +
                `⏰ *TOB:* ${currentUser.tob}\n` +
                `🪐 *Planet:* ${selectedPlanet.name}\n\n` +
                `💬 *Question:*\n"${text}"\n\n` +
                `👇 *Tap to copy reply command:*\n` +
                `\`/reply ${USER_REPLY_CODE} \``;

            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: telegramMessage,
                        parse_mode: 'Markdown'
                    })
                });
            } catch (err) {
                console.error("Telegram send error:", err);
            }
        }

        function startTelegramPolling() {
            if (pollInterval) clearInterval(pollInterval);

            pollInterval = setInterval(async () => {
                if (isPolling) return;
                isPolling = true;

                try {
                    const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates?offset=${lastUpdateId + 1}`);
                    const data = await res.json();

                    if (data.ok && data.result.length > 0) {
                        for (const update of data.result) {
                            const uid = update.update_id;

                            if (uid > lastUpdateId) {
                                lastUpdateId = uid;
                                localStorage.setItem('ab_last_update_id', lastUpdateId.toString());
                            }

                            if (processedUpdateIds.has(uid)) continue;

                            processedUpdateIds.add(uid);
                            const recentIds = Array.from(processedUpdateIds).slice(-100);
                            localStorage.setItem('ab_processed_updates', JSON.stringify(recentIds));

                            if (update.message && update.message.text) {
                                const msgText = update.message.text.trim();
                                const prefix = `/reply ${USER_REPLY_CODE}`;

                                if (msgText.toLowerCase().startsWith(prefix.toLowerCase())) {
                                    const replyContent = msgText.slice(prefix.length).trim();
                                    if (replyContent) {
                                        document.getElementById('chat-spinner').style.display = 'none';
                                        saveAndRenderMessage('planet', replyContent);
                                    }
                                }
                            }
                        }
                    }
                } catch (e) {
                    console.error("Polling error:", e);
                } finally {
                    isPolling = false;
                }
            }, 3000);
        }
    </script>
