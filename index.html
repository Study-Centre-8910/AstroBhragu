<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroBhrigu - Consult Planetary Energies</title>
    <style>
        :root {
            --bg-color: #07090f;
            --card-bg: #111522;
            --accent-color: #d4af37;
            --text-color: #e2e8f0;
            --text-dim: #94a3b8;
            --border-color: rgba(212, 175, 55, 0.25);
            --chat-user-bg: #1e293b;
            --chat-planet-bg: #161e31;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, #161d33 0%, #07090f 70%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(17, 21, 34, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand h1 {
            color: var(--accent-color);
            font-size: 1.7rem;
            letter-spacing: 2px;
            user-select: none;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        .container {
            max-width: 1050px;
            margin: 2rem auto;
            padding: 0 1rem;
            width: 100%;
            flex: 1;
        }

        /* User Onboarding Form */
        .user-form-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2.2rem;
            max-width: 460px;
            margin: 2rem auto;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-dim);
            font-size: 0.95rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.85rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #080a12;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: var(--accent-color);
        }

        .btn-primary {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, #e5c158, #b58e22);
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: bold;
            font-size: 1.05rem;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        .btn-primary:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }

        /* Planets Grid */
        .planets-section {
            display: none;
        }

        .section-title {
            text-align: center;
            margin-bottom: 2rem;
            color: var(--accent-color);
            font-size: 1.5rem;
        }

        .planets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .planet-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s;
            position: relative;
            overflow: hidden;
        }

        .planet-card:hover {
            transform: translateY(-6px);
            border-color: var(--accent-color);
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.15);
        }

        /* Realistic 3D Rotating Planet Sphere */
        .planet-sphere-wrapper {
            width: 82px;
            height: 82px;
            margin: 0 auto 1.1rem;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .planet-sphere {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-size: 200% 100%;
            background-repeat: repeat-x;
            animation: rotatePlanetAxis 14s linear infinite;
            position: relative;
            z-index: 2;
        }

        /* 3D Spherical Lighting & Shadow Overlay */
        .planet-sphere::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            box-shadow: inset -14px -10px 22px rgba(0, 0, 0, 0.88),
                        inset 5px 5px 12px rgba(255, 255, 255, 0.25);
        }

        /* Special Ring for Saturn */
        .saturn-ring {
            position: absolute;
            width: 132px;
            height: 36px;
            border-radius: 50%;
            border: 6px solid rgba(218, 195, 145, 0.65);
            box-shadow: 0 0 8px rgba(218, 195, 145, 0.3), inset 0 0 6px rgba(0,0,0,0.6);
            transform: rotate(-22deg);
            z-index: 3;
            pointer-events: none;
        }

        @keyframes rotatePlanetAxis {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        .planet-card h4 {
            color: #fff;
            font-size: 1.05rem;
            margin-bottom: 0.25rem;
        }

        .planet-card small {
            color: var(--text-dim);
            font-size: 0.8rem;
        }

        /* Chat Window */
        .chat-section {
            display: none;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            max-width: 720px;
            margin: 0 auto;
            overflow: hidden;
            height: 550px;
            flex-direction: column;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
        }

        .chat-header {
            background: rgba(7, 9, 15, 0.7);
            padding: 1rem 1.2rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .chat-header-planet {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-size: 200% 100%;
            background-repeat: repeat-x;
            animation: rotatePlanetAxis 12s linear infinite;
            position: relative;
            flex-shrink: 0;
        }

        .chat-header-planet::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            box-shadow: inset -8px -6px 12px rgba(0, 0, 0, 0.85),
                        inset 3px 3px 6px rgba(255, 255, 255, 0.25);
        }

        .chat-messages {
            flex: 1;
            padding: 1.2rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            max-width: 78%;
            padding: 0.85rem 1.1rem;
            border-radius: 14px;
            line-height: 1.5;
            font-size: 0.96rem;
            word-wrap: break-word;
        }

        .message.user {
            align-self: flex-end;
            background: var(--chat-user-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-bottom-right-radius: 3px;
        }

        .message.planet {
            align-self: flex-start;
            background: var(--chat-planet-bg);
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 3px;
            color: #f8fafc;
        }

        /* Waiting Spinner */
        .spinner-wrapper {
            align-self: flex-start;
            margin: 0 1.2rem 0.8rem;
            padding: 0.65rem 1rem;
            background: var(--chat-planet-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: none;
        }

        .spinner {
            width: 22px;
            height: 22px;
            border: 3px solid rgba(212, 175, 55, 0.25);
            border-radius: 50%;
            border-top-color: var(--accent-color);
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .chat-input-area {
            padding: 1rem;
            background: rgba(7, 9, 15, 0.5);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 0.6rem;
        }

        .chat-input-area input {
            flex: 1;
            padding: 0.85rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #080a12;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }

        .chat-input-area input:focus {
            border-color: var(--accent-color);
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <h1>AstroBhrigu</h1>
        </div>
        <div style="color: var(--text-dim); font-size: 0.9rem;">
            Vedic Planetary Consultation
        </div>
    </header>

    <div class="container">
        <!-- 1. USER DETAILS FORM -->
        <div id="user-form-card" class="user-form-card">
            <h2 style="text-align: center; margin-bottom: 1.5rem; color: var(--accent-color);">अपनी जन्म कुंडली विवरण दें</h2>
            <form id="onboarding-form">
                <div class="form-group">
                    <label>पूरा नाम (Full Name)</label>
                    <input type="text" id="user-name" required placeholder="उदा. राहुल शर्मा">
                </div>
                <div class="form-group">
                    <label>जन्म तिथि (Date of Birth)</label>
                    <input type="date" id="user-dob" required>
                </div>
                <div class="form-group">
                    <label>जन्म समय (Time of Birth)</label>
                    <input type="time" id="user-tob" required>
                </div>
                <button type="submit" class="btn-primary">ग्रहों से जुड़ें</button>
            </form>
        </div>

        <!-- 2. PLANETS GRID -->
        <div id="planets-section" class="planets-section">
            <h2 class="section-title">किस ग्रह से परामर्श करना चाहते हैं?</h2>
            <div class="planets-grid" id="planets-grid"></div>
        </div>

        <!-- 3. CHAT INTERFACE -->
        <div id="chat-section" class="chat-section">
            <div class="chat-header">
                <div id="selected-planet-icon" class="chat-header-planet"></div>
                <div>
                    <h3 id="selected-planet-name" style="color: var(--accent-color); font-size: 1.15rem;">Planet</h3>
                    <small id="user-display-info" style="color: var(--text-dim);"></small>
                </div>
                <button id="back-to-planets" style="margin-left: auto; background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color: #fff; padding: 0.45rem 0.9rem; border-radius: 6px; cursor: pointer;">ग्रह बदलें</button>
            </div>
            
            <div class="chat-messages" id="chat-messages"></div>
            
            <!-- Silent Loading Spinner -->
            <div class="spinner-wrapper" id="chat-spinner">
                <div class="spinner"></div>
            </div>

            <div class="chat-input-area">
                <input type="text" id="user-input" placeholder="अपना प्रश्न यहाँ लिखें...">
                <button id="send-btn" class="btn-primary" style="width: auto; padding: 0 1.6rem;">भेजें</button>
            </div>
        </div>
    </div>

    <script>
        // TELEGRAM CONFIGURATION
        const BOT_TOKEN = "9045141687:AAG1PLqHlmTyIqZM2Mvz7U5CscXr6zmCHCM";
        const CHAT_ID = "7698399943";

        // REALISTIC PLANETARY TEXTURES & GLOWS
        const planetsData = [
            { 
                id: 'sun', 
                name: 'Sun (सूर्य)', 
                sub: 'आत्मा व तेज',
                texture: 'https://upload.wikimedia.org/wikipedia/commons/thumb/9/99/Map_of_the_full_sun.jpg/640px-Map_of_the_full_sun.jpg',
                fallback: 'radial-gradient(circle at 30% 30%, #fff3b0, #ff9900 45%, #cc3300 90%)',
                glow: 'rgba(255, 165, 0, 0.55)'
            },
            { 
                id: 'moon', 
                name: 'Moon (चंद्र)', 
                sub: 'मन व शांति',
                texture: 'https://upload.wikimedia.org/wikipedia/commons/thumb/d/d1/Moon_map_grid_showing_near_and_far_sides.jpg/640px-Moon_map_grid_showing_near_and_far_sides.jpg',
                fallback: 'radial-gradient(circle at 30% 30%, #ffffff, #cbd5e1 55%, #64748b 95%)',
                glow: 'rgba(226, 232, 240, 0.45)'
            },
            { 
                id: 'mars', 
                name: 'Mars (मंगल)', 
                sub: 'साहस व ऊर्जा',
                texture: 'https://upload.wikimedia.org/wikipedia/commons/thumb/0/02/OSIRIS_Mars_true_color.jpg/640px-OSIRIS_Mars_true_color.jpg',
                fallback: 'radial-gradient(circle at 30% 30%, #ff8a65, #d84315 55%, #4e1609 95%)',
                glow: 'rgba(239, 68, 68, 0.5)'
            },
            { 
                id: 'mercury', 
                name: 'Mercury (बुध)', 
                sub: 'बुद्धि व वाणी',
                texture: 'https://upload.wikimedia.org/wikipedia/commons/thumb/3/30/Mercury_in_color_-_Prockter07_centered.jpg/640px-Mercury_in_color_-_Prockter07_centered.jpg',
                fallback: 'radial-gradient(circle at 30% 30%, #a7f3d0, #10b981 55%, #064e3b 95%)',
                glow: 'rgba(16, 185, 129, 0.45)'
            },
            { 
                id: 'jupiter', 
                name: 'Jupiter (गुरु)', 
                sub: 'ज्ञान व भाग्य',
                texture: 'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e2/Jupiter.jpg/640px-Jupiter.jpg',
                fallback: 'radial-gradient(circle at 30% 30%, #fef08a, #d97706 55%, #78350f 95%)',
                glow: 'rgba(245, 158, 11, 0.5)'
            },
            { 
                id: 'venus', 
                name: 'Venus (शुक्र)', 
                sub: 'प्रेम व वैभव',
                texture: 'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e5/Venus-real_color.jpg/640px-Venus-real_color.jpg',
                fallback: 'radial-gradient(circle at 30% 30%, #fbcfe8, #ec4899 55%, #831843 95%)',
                glow: 'rgba(244, 114, 182, 0.45)'
            },
            { 
                id: 'saturn', 
                name: 'Saturn (शनि)', 
                sub: 'कर्म व न्याय',
                texture: 'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c7/Saturn_during_Equinox.jpg/640px-Saturn_during_Equinox.jpg',
                fallback: 'radial-gradient(circle at 30% 30%, #fde68a, #b45309 60%, #451a03 95%)',
                glow: 'rgba(217, 119, 6, 0.45)',
                hasRing: true
            },
            { 
                id: 'rahu', 
                name: 'Rahu (राहु)', 
                sub: 'रहस्य व महत्वाकांक्षा',
                texture: 'https://upload.wikimedia.org/wikipedia/commons/thumb/5/56/Neptune_Full.jpg/640px-Neptune_Full.jpg',
                fallback: 'radial-gradient(circle at 30% 30%, #818cf8, #3730a3 55%, #1e1b4b 95%)',
                glow: 'rgba(99, 102, 241, 0.5)'
            },
            { 
                id: 'ketu', 
                name: 'Ketu (केतु)', 
                sub: 'मोक्ष व वैराग्य',
                texture: 'https://upload.wikimedia.org/wikipedia/commons/thumb/e/ef/Pluto_in_True_Color_-_High-Res.jpg/640px-Pluto_in_True_Color_-_High-Res.jpg',
                fallback: 'radial-gradient(circle at 30% 30%, #cbd5e1, #475569 55%, #0f172a 95%)',
                glow: 'rgba(148, 163, 184, 0.4)'
            }
        ];

        // 1. PERSISTENT UNIQUE REPLY CODE PER DEVICE/USER
        // यह कोड एक बार बनने के बाद इस यूजर/डिवाइस के लिए फिक्स रहेगा, बार-बार नहीं बदलेगा
        function getOrCreateUserReplyCode() {
            let code = localStorage.getItem('astrobhrigu_user_code');
            if (!code) {
                code = 'u_' + Math.floor(1000 + Math.random() * 9000);
                localStorage.setItem('astrobhrigu_user_code', code);
            }
            return code;
        }

        const USER_REPLY_CODE = getOrCreateUserReplyCode();
        let currentUser = null;
        let selectedPlanet = null;
        let pollInterval = null;
        let isPolling = false;

        // Track processed Telegram update_ids so no message ever duplicates
        let processedUpdateIds = new Set(JSON.parse(localStorage.getItem('ab_processed_updates') || '[]'));
        let lastUpdateId = parseInt(localStorage.getItem('ab_last_update_id') || '0', 10);

        // Initialize Telegram offset on page load so old messages don't flood
        async function syncInitialTelegramOffset() {
            try {
                const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates?offset=-1`);
                const data = await res.json();
                if (data.ok && data.result.length > 0) {
                    const latestId = data.result[data.result.length - 1].update_id;
                    if (latestId > lastUpdateId) {
                        lastUpdateId = latestId;
                        localStorage.setItem('ab_last_update_id', lastUpdateId.toString());
                    }
                }
            } catch (e) {
                console.error("Initial offset sync error:", e);
            }
        }
        syncInitialTelegramOffset();

        // User Onboarding Form Submit
        document.getElementById('onboarding-form').addEventListener('submit', (e) => {
            e.preventDefault();
            currentUser = {
                name: document.getElementById('user-name').value.trim(),
                dob: document.getElementById('user-dob').value,
                tob: document.getElementById('user-tob').value
            };

            document.getElementById('user-form-card').style.display = 'none';
            renderPlanets();
            document.getElementById('planets-section').style.display = 'block';
        });

        // Render Realistic 3D Rotating Planets
        function renderPlanets() {
            const grid = document.getElementById('planets-grid');
            grid.innerHTML = '';
            planetsData.forEach(p => {
                const card = document.createElement('div');
                card.className = 'planet-card';
                
                const ringHTML = p.hasRing ? `<div class="saturn-ring"></div>` : '';
                
                card.innerHTML = `
                    <div class="planet-sphere-wrapper">
                        <div class="planet-sphere" style="background-image: url('${p.texture}'), ${p.fallback}; box-shadow: 0 0 22px ${p.glow};"></div>
                        ${ringHTML}
                    </div>
                    <h4>${p.name}</h4>
                    <small>${p.sub}</small>
                `;
                card.onclick = () => selectPlanet(p);
                grid.appendChild(card);
            });
        }

        // Select Planet & Open Chat
        function selectPlanet(planet) {
            selectedPlanet = planet;

            document.getElementById('planets-section').style.display = 'none';
            document.getElementById('chat-section').style.display = 'flex';

            document.getElementById('selected-planet-name').innerText = planet.name;
            const iconEl = document.getElementById('selected-planet-icon');
            iconEl.style.backgroundImage = `url('${planet.texture}'), ${planet.fallback}`;
            iconEl.style.boxShadow = `0 0 14px ${planet.glow}`;

            document.getElementById('user-display-info').innerText = `${currentUser.name} • ID: ${USER_REPLY_CODE}`;

            // Load existing chat history for this planet if any
            loadChatHistory();

            // Start Polling for Admin Reply
            startTelegramPolling();
        }

        document.getElementById('back-to-planets').onclick = () => {
            document.getElementById('chat-section').style.display = 'none';
            document.getElementById('planets-section').style.display = 'block';
        };

        // Chat History Management per Planet
        function getChatStorageKey() {
            return `ab_chat_${USER_REPLY_CODE}_${selectedPlanet.id}`;
        }

        function loadChatHistory() {
            const msgContainer = document.getElementById('chat-messages');
            msgContainer.innerHTML = '';
            const history = JSON.parse(localStorage.getItem(getChatStorageKey()) || '[]');
            history.forEach(item => {
                renderMessageBubble(item.sender, item.text);
            });
        }

        function saveAndRenderMessage(sender, text) {
            const history = JSON.parse(localStorage.getItem(getChatStorageKey()) || '[]');
            history.push({ sender, text, time: Date.now() });
            localStorage.setItem(getChatStorageKey(), JSON.stringify(history));
            renderMessageBubble(sender, text);
        }

        function renderMessageBubble(sender, text) {
            const msgContainer = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.innerText = text;
            msgContainer.appendChild(div);
            msgContainer.scrollTop = msgContainer.scrollHeight;
        }

        // Send User Message to Telegram
        document.getElementById('send-btn').onclick = sendUserMessage;
        document.getElementById('user-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendUserMessage();
        });

        async function sendUserMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            saveAndRenderMessage('user', text);
            input.value = '';

            // Show Silent Loading Spinner
            document.getElementById('chat-spinner').style.display = 'block';

            const telegramMessage = 
                `🔮 *ASTROBHRIGU CONSULTATION*\n\n` +
                `🆔 *User Code:* \`${USER_REPLY_CODE}\`\n` +
                `👤 *Name:* ${currentUser.name}\n` +
                `📅 *DOB:* ${currentUser.dob}\n` +
                `⏰ *TOB:* ${currentUser.tob}\n` +
                `🪐 *Planet:* ${selectedPlanet.name}\n\n` +
                `💬 *Question:*\n"${text}"\n\n` +
                `👇 *Tap to copy reply command:*\n` +
                `\`/reply ${USER_REPLY_CODE} \``;

            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: telegramMessage,
                        parse_mode: 'Markdown'
                    })
                });
            } catch (err) {
                console.error("Telegram send error:", err);
            }
        }

        // Poll Telegram Updates (Strictly Single Delivery, No Duplicates)
        function startTelegramPolling() {
            if (pollInterval) clearInterval(pollInterval);

            pollInterval = setInterval(async () => {
                if (isPolling) return; // Prevent overlapping requests
                isPolling = true;

                try {
                    const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates?offset=${lastUpdateId + 1}`);
                    const data = await res.json();

                    if (data.ok && data.result.length > 0) {
                        for (const update of data.result) {
                            const uid = update.update_id;

                            // Update offset immediately
                            if (uid > lastUpdateId) {
                                lastUpdateId = uid;
                                localStorage.setItem('ab_last_update_id', lastUpdateId.toString());
                            }

                            // Skip if this exact update was already processed
                            if (processedUpdateIds.has(uid)) continue;

                            processedUpdateIds.add(uid);
                            // Keep only last 100 processed IDs in storage
                            const recentIds = Array.from(processedUpdateIds).slice(-100);
                            localStorage.setItem('ab_processed_updates', JSON.stringify(recentIds));

                            if (update.message && update.message.text) {
                                const msgText = update.message.text.trim();
                                const prefix = `/reply ${USER_REPLY_CODE}`;

                                // Match exact user reply code (case-insensitive check for command)
                                if (msgText.toLowerCase().startsWith(prefix.toLowerCase())) {
                                    const replyContent = msgText.slice(prefix.length).trim();
                                    if (replyContent) {
                                        document.getElementById('chat-spinner').style.display = 'none';
                                        saveAndRenderMessage('planet', replyContent);
                                    }
                                }
                            }
                        }
                    }
                } catch (e) {
                    console.error("Polling error:", e);
                } finally {
                    isPolling = false;
                }
            }, 3000);
        }
    </script>
</body>
</html>
